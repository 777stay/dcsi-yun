server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.whu.yun.mybatis.entity

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mydatabase?useUnicode=true&characterEncoding=utf-8
    username: root
    password: "${MYSQL_ROOT_PASSWORD:change-this-database-password}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-request-size: 2GB
      max-file-size: 1GB
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

grpc:
  server:
    port: 50052
    address: 0.0.0.0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.whu.yun.entity
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: 127.0.0.1:9876
  topic: RobotDataTopic
  consumer:
    group: PointCloudConsumerGroup
  producer:
    group: robot-producer-group

# ✅ 关键修改：支持多环境路径检测
# 开发环境使用 /home/dcsi1/project
# 生产环境使用 /home/dcsi-alm-001/yun-deploy
# Docker环境使用 /app
project:
  # 默认路径（如果上面都不存在，使用这个）
  path: /home/dcsi-alm-001/yun-deploy/backend

upload:
  path: ${project.path}/headImgs

ply:
  storage:
    path: ./ply_files/
  potreeStorge:
    path: ./dist/data/

potree:
  converter:
    path: ${project.path}/yun/PotreeConverter/build/PotreeConverter
  metajsonUrl:
    path: /home/dcsi-alm-001/yun-deploy/shared_data/dist_data/

fusion:
  workspace-root: /home/dcsi-alm-001/yun-deploy/shared_data/change_potree_view
  default-dataset: 20260603-094908
  runner-path: scripts/fusion_runner.py
  script-path: ${fusion.workspace-root}/20260603-094908/fuse_cloud_instances_3d_multi_uav_scattered_pcd.py
  public-prefix: ${FUSION_PUBLIC_PREFIX:/dist/data}
  docker:
    enabled: true
    command: sudo docker
    image: yun-deploy-backend-service:latest
    workspace-root: /app/change_potree_view
    potree-output: /app/dist/data
    runner-path: /app/scripts/fusion_runner.py
    fusion-script: /app/change_potree_view/20260603-094908/fuse_cloud_instances_3d_multi_uav_scattered_pcd.py
    converter-script: /app/scripts/converter.py
    potree-converter: /app/yun/PotreeConverter/build/PotreeConverter

py2json:
  # ✅ 改为空值，由Java代码动态确定
  path: ${project.path}/py2json

lib:
  path: ${project.path}/yun/lib

utils:
  path: ${project.path}/yun/src/main/java/com/whu/yun/utils

# ✅ Python配置改进
python:
  path: python3
  # 优先尝试虚拟环境，其次系统Python
  executable: /home/dcsi1/miniconda3/envs/yun/bin/python
  fallback-executable: python3  # 备选方案

  script:
    path: scripts/converter.py
    pylon-check-path: "src/main/resources/scripts/check_tower_existence.py"
    change-detection-path: "src/main/resources/scripts/ply-changedetection.py"
    detectPlyPath: scripts/ply-changedetection.py
    kmlCoordTransPath: scripts/kml-coord-trans.py

app:
  file-storage:
    image-path: "${project.path}/yun/data/images"
    point-cloud-path: "${project.path}/data/pointclouds/"
    annotated-image-path: "${project.path}/yun/data/annotated_images/"
    kml-path: "${project.path}/data/kml/"
    report-image-path: "${project.path}/data/report_images/"

  jwt:
    secret: "${APP_JWT_SECRET:change-this-jwt-secret-before-production}"
    expiration-ms: 86400000

  robots:
    robot:
      display_name: "控制站"
    robot_01:
      display_name: "无人机M400"
    robot_02:
      display_name: "无人机M400"
    robot_03:
      display_name: "无人机"

  python:
    interpreter-path: "/home/dcsi1/miniconda3/envs/obd/bin/python"
    detection-script-path: "${project.path}/image_test/detect_to_excel.py"
    model-weight-path: "${project.path}/image_test/weights/epoch80.pt"
    annotated-image-path: "${project.path}/yun/data/annotated_images/"
    report-script-path: "${project.path}/image_test/generate_pdf_report.py"
    confidence-threshold: 0.5
